<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Global Country Explorer</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Montserrat',sans-serif;
    }

    body{
      min-height:100vh;
      background:
      linear-gradient(rgba(5,10,25,0.8), rgba(5,10,25,0.9)),
      url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5ce?q=80&w=1920&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px;
      overflow-x:hidden;
    }

    .container{
      width:100%;
      max-width:950px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:35px;
      padding:40px;
      color:white;
      box-shadow:0 15px 50px rgba(0,0,0,0.5);
      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .top{
      text-align:center;
      margin-bottom:35px;
    }

    .top h1{
      font-size:52px;
      font-weight:800;
      letter-spacing:2px;
      background:linear-gradient(to right,#38bdf8,#ffffff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .top p{
      color:#cbd5e1;
      margin-top:10px;
      font-size:15px;
      letter-spacing:1px;
    }

    .search-box{
      display:flex;
      align-items:center;
      gap:15px;
      margin-bottom:35px;
    }

    .search-box input{
      flex:1;
      padding:18px 22px;
      border:none;
      outline:none;
      border-radius:18px;
      background:rgba(255,255,255,0.08);
      color:white;
      font-size:16px;
      border:1px solid rgba(255,255,255,0.1);
      transition:0.4s;
    }

    .search-box input::placeholder{
      color:#cbd5e1;
    }

    .search-box input:focus{
      border-color:#38bdf8;
      box-shadow:0 0 15px rgba(56,189,248,0.4);
    }

    .search-box button{
      width:65px;
      height:65px;
      border:none;
      border-radius:18px;
      background:linear-gradient(135deg,#0ea5e9,#2563eb);
      color:white;
      font-size:22px;
      cursor:pointer;
      transition:0.4s;
      box-shadow:0 8px 20px rgba(37,99,235,0.4);
    }

    .search-box button:hover{
      transform:translateY(-4px) scale(1.05);
      box-shadow:0 15px 30px rgba(37,99,235,0.6);
    }

    .country-card{
      display:grid;
      grid-template-columns:350px 1fr;
      gap:35px;
      align-items:center;
      animation:showCard 0.7s ease;
    }

    @keyframes showCard{
      from{
        opacity:0;
        transform:scale(0.9);
      }
      to{
        opacity:1;
        transform:scale(1);
      }
    }

    .flag-box{
      position:relative;
    }

    .flag-box img{
      width:100%;
      border-radius:28px;
      box-shadow:0 15px 40px rgba(0,0,0,0.5);
      transition:0.5s;
    }

    .flag-box img:hover{
      transform:scale(1.03);
    }

    .country-info h2{
      font-size:48px;
      font-weight:800;
      margin-bottom:5px;
    }

    .official-name{
      color:#94a3b8;
      margin-bottom:25px;
      font-size:15px;
      letter-spacing:1px;
    }

    .info-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .info-box{
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:22px;
      padding:22px;
      transition:0.4s;
      position:relative;
      overflow:hidden;
    }

    .info-box::before{
      content:'';
      position:absolute;
      width:100%;
      height:4px;
      top:0;
      left:0;
      background:linear-gradient(to right,#38bdf8,#2563eb);
    }

    .info-box:hover{
      transform:translateY(-6px);
      background:rgba(255,255,255,0.1);
      box-shadow:0 10px 30px rgba(0,0,0,0.25);
    }

    .info-box i{
      font-size:22px;
      margin-bottom:12px;
      color:#38bdf8;
    }

    .info-box h4{
      color:#cbd5e1;
      font-size:13px;
      font-weight:500;
      margin-bottom:8px;
      letter-spacing:1px;
    }

    .info-box p{
      font-size:18px;
      font-weight:700;
      line-height:1.5;
      word-break:break-word;
    }

    .error{
      text-align:center;
      color:#ffb4b4;
      font-size:18px;
      margin-top:20px;
    }

    .footer{
      margin-top:35px;
      text-align:center;
      color:#94a3b8;
      font-size:13px;
      letter-spacing:1px;
    }

    @media(max-width:850px){

      .country-card{
        grid-template-columns:1fr;
      }

      .country-info h2{
        font-size:38px;
      }

      .top h1{
        font-size:38px;
      }

    }

    @media(max-width:600px){

      .info-grid{
        grid-template-columns:1fr;
      }

      .container{
        padding:25px;
      }

    }

  </style>
</head>
<body>

  <div class="container">

    <div class="top">
      <h1>GLOBAL EXPLORER</h1>
      <p>SEARCH ANY COUNTRY IN THE WORLD</p>
    </div>

    <div class="search-box">

      <input 
        type="text" 
        id="countryInput"
        placeholder="Masukkan nama negara..."
      >

      <button onclick="cariNegara()">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>

    </div>

    <div id="result"></div>

    <div class="footer">
      Designed By Rian • Modern Country Information System
    </div>

  </div>

  <script>

    async function cariNegara(){

      const nama = document
      .getElementById("countryInput")
      .value.trim();

      if(!nama){
        alert("Masukkan nama negara!");
        return;
      }

      try{

        const response = await fetch(
          `https://restcountries.com/v3.1/name/${encodeURIComponent(nama)}`
        );

        if(!response.ok){
          throw new Error("Negara tidak ditemukan!");
        }

        const data = await response.json();

        const d = data[0];

        const bahasa = d.languages
        ? Object.values(d.languages).join(', ')
        : 'Tidak tersedia';

        const mataUang = d.currencies
        ? Object.values(d.currencies)[0].name
        : 'Tidak tersedia';

        const simbolUang = d.currencies
        ? Object.values(d.currencies)[0].symbol
        : '-';

        const ibukota = d.capital
        ? d.capital[0]
        : 'Tidak tersedia';

        document.getElementById("result").innerHTML = `

          <div class="country-card">

            <div class="flag-box">

              <img 
                src="${d.flags.svg}" 
                alt="Bendera ${d.name.common}"
              >

            </div>

            <div class="country-info">

              <h2>${d.name.common}</h2>

              <div class="official-name">
                ${d.name.official}
              </div>

              <div class="info-grid">

                <div class="info-box">
                  <i class="fa-solid fa-users"></i>
                  <h4>POPULATION</h4>
                  <p>${d.population.toLocaleString()}</p>
                </div>

                <div class="info-box">
                  <i class="fa-solid fa-earth-asia"></i>
                  <h4>REGION</h4>
                  <p>${d.region}</p>
                </div>

                <div class="info-box">
                  <i class="fa-solid fa-city"></i>
                  <h4>CAPITAL</h4>
                  <p>${ibukota}</p>
                </div>

                <div class="info-box">
                  <i class="fa-solid fa-language"></i>
                  <h4>LANGUAGES</h4>
                  <p>${bahasa}</p>
                </div>

                <div class="info-box">
                  <i class="fa-solid fa-money-bill-wave"></i>
                  <h4>CURRENCY</h4>
                  <p>${mataUang} (${simbolUang})</p>
                </div>

                <div class="info-box">
                  <i class="fa-solid fa-map-location-dot"></i>
                  <h4>SUB REGION</h4>
                  <p>${d.subregion || 'Tidak tersedia'}</p>
                </div>

              </div>

            </div>

          </div>

        `;

      }catch(error){

        document.getElementById("result").innerHTML = `
          <p class="error">
            <i class="fa-solid fa-circle-exclamation"></i>
            ${error.message}
          </p>
        `;

      }

    }

  </script>

</body>
</html>
