<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App Modern</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1d4ed8,#38bdf8);
      overflow:hidden;
      position:relative;
      padding:20px;
    }

    /* Efek background */
    body::before,
    body::after{
      content:'';
      position:absolute;
      border-radius:50%;
      filter:blur(90px);
      opacity:0.4;
    }

    body::before{
      width:300px;
      height:300px;
      background:#38bdf8;
      top:-100px;
      left:-100px;
    }

    body::after{
      width:350px;
      height:350px;
      background:#9333ea;
      bottom:-120px;
      right:-120px;
    }

    .container{
      width:420px;
      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:30px;
      padding:30px;
      color:white;
      box-shadow:0 10px 40px rgba(0,0,0,0.3);
      position:relative;
      z-index:2;
      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      text-align:center;
      margin-bottom:5px;
      font-size:30px;
      font-weight:700;
    }

    .subtitle{
      text-align:center;
      color:#ddd;
      margin-bottom:25px;
      font-size:14px;
    }

    .search-box{
      display:flex;
      gap:10px;
      margin-bottom:25px;
    }

    .search-box input{
      flex:1;
      padding:14px;
      border:none;
      outline:none;
      border-radius:15px;
      background:rgba(255,255,255,0.15);
      color:white;
      font-size:15px;
    }

    .search-box input::placeholder{
      color:#ddd;
    }

    .search-box button{
      width:55px;
      border:none;
      border-radius:15px;
      background:white;
      color:#1d4ed8;
      cursor:pointer;
      font-size:18px;
      transition:0.3s;
    }

    .search-box button:hover{
      background:#38bdf8;
      color:white;
      transform:scale(1.05);
    }

    #hasil{
      margin-top:20px;
    }

    .weather-header{
      text-align:center;
      margin-bottom:20px;
    }

    .weather-icon{
      width:120px;
      animation:float 3s ease-in-out infinite;
    }

    @keyframes float{
      0%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-10px);
      }
      100%{
        transform:translateY(0px);
      }
    }

    .temp{
      font-size:60px;
      font-weight:700;
      margin-top:10px;
    }

    .city{
      font-size:28px;
      font-weight:600;
    }

    .desc{
      text-transform:capitalize;
      color:#ddd;
      margin-top:5px;
      font-size:18px;
    }

    .details{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
      margin-top:25px;
    }

    .card{
      background:rgba(255,255,255,0.12);
      padding:18px;
      border-radius:20px;
      transition:0.3s;
      text-align:center;
    }

    .card:hover{
      transform:translateY(-5px);
      background:rgba(255,255,255,0.2);
    }

    .card i{
      font-size:22px;
      margin-bottom:10px;
      color:#38bdf8;
    }

    .card h4{
      font-size:14px;
      color:#ddd;
      margin-bottom:5px;
    }

    .card p{
      font-size:18px;
      font-weight:600;
    }

    .error{
      text-align:center;
      color:#ffb4b4;
      margin-top:15px;
      font-weight:500;
    }

    .footer{
      margin-top:25px;
      text-align:center;
      color:#ddd;
      font-size:12px;
    }

  </style>
</head>
<body>

  <div class="container">

    <h1>🌤 Info Cuaca</h1>
    <p class="subtitle">TUGAS PRAKTIKUM 1</p>

    <div class="search-box">
      <input type="text" id="kota" placeholder="Masukkan nama kota...">
      <button onclick="ambilCuaca()">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>

    <div id="hasil"></div>

    <div class="footer">
      Dibuat oleh ❤️ Rian
    </div>

  </div>

  <script>

    const apiKey = "b7cfbf7672ca3dc124a4f950ceb813a4";

    async function ambilCuaca(){

      const namaKota = document.getElementById("kota").value;

      if(namaKota === ""){
        alert("Masukkan nama kota terlebih dahulu!");
        return;
      }

      const url = `https://api.openweathermap.org/data/2.5/weather?q=${namaKota}&units=metric&appid=${apiKey}&lang=id`;

      try{

        const response = await fetch(url);

        if(!response.ok){
          throw new Error("Kota tidak ditemukan!");
        }

        const data = await response.json();

        const suhu = Math.round(data.main.temp);
        const suhuMin = Math.round(data.main.temp_min);
        const suhuMax = Math.round(data.main.temp_max);

        const cuaca = data.weather[0].description;
        const kelembaban = data.main.humidity;
        const tekanan = data.main.pressure;
        const angin = data.wind.speed;
        const arahAngin = data.wind.deg;
        const awan = data.clouds.all;
        const visibility = data.visibility / 1000;

        const nama = data.name;

        const icon = data.weather[0].icon;

        document.getElementById("hasil").innerHTML = `

          <div class="weather-header">

            <img 
              src="https://openweathermap.org/img/wn/${icon}@4x.png"
              class="weather-icon"
            >

            <div class="temp">${suhu}°C</div>

            <div class="city">${nama}</div>

            <div class="desc">${cuaca}</div>

          </div>

          <div class="details">

            <div class="card">
              <i class="fa-solid fa-temperature-half"></i>
              <h4>Suhu Min-Max</h4>
              <p>${suhuMin}° - ${suhuMax}°</p>
            </div>

            <div class="card">
              <i class="fa-solid fa-droplet"></i>
              <h4>Kelembaban</h4>
              <p>${kelembaban}%</p>
            </div>

            <div class="card">
              <i class="fa-solid fa-gauge-high"></i>
              <h4>Tekanan</h4>
              <p>${tekanan} mb</p>
            </div>

            <div class="card">
              <i class="fa-solid fa-wind"></i>
              <h4>Kecepatan Angin</h4>
              <p>${angin} m/s</p>
            </div>

            <div class="card">
              <i class="fa-solid fa-compass"></i>
              <h4>Arah Angin</h4>
              <p>${arahAngin}°</p>
            </div>

            <div class="card">
              <i class="fa-solid fa-cloud"></i>
              <h4>Tutupan Awan</h4>
              <p>${awan}%</p>
            </div>

            <div class="card">
              <i class="fa-solid fa-eye"></i>
              <h4>Jarak Pandang</h4>
              <p>${visibility} km</p>
            </div>

          </div>

        `;

      }catch(error){

        document.getElementById("hasil").innerHTML = `
          <p class="error">
            <i class="fa-solid fa-circle-exclamation"></i>
            ${error.message}
          </p>
        `;

      }

    }

  </script>

</body>
</html>
